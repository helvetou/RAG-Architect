[project]
name = "rag-architect-sizing-engine"
version = "0.1.0"
description = "RAG-Architect Core Sizing Engine — Python 3.12 microservice (CMMI L3 & strict TDD)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "numpy>=2.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core", "api", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=core --cov=api --cov-fail-under=95 --cov-branch"
testpaths = ["tests"]
