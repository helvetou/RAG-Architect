name = "rag-architect-portal"
pages_build_output_dir = ".svelte-kit/cloudflare"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Configuration Production (par défaut)
[[d1_databases]]
binding = "DB"
database_name = "rag-architect-db"
database_id = "ba6b952e-1d76-4201-a650-aba9df3d0307"

[vars]
SIZING_ENGINE_URL = "https://rag-architect-sizing.fly.dev"
TELEMETRY_WORKER_URL = "https://telemetry-worker.haroudm.workers.dev"

# Configuration Preview (pour les URLs de déploiement intermédiaires)
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "rag-architect-db"
database_id = "ba6b952e-1d76-4201-a650-aba9df3d0307"

[env.preview.vars]
SIZING_ENGINE_URL = "https://rag-architect-sizing.fly.dev"
TELEMETRY_WORKER_URL = "https://telemetry-worker.haroudm.workers.dev"
